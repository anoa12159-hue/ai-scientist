name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: local-equivalent verification
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install package with dev dependencies
        run: python -m pip install -e ".[dev]"

      - name: Smoke tests
        run: python -m pytest tests/smoke -q

      - name: Lint
        run: python -m ruff check .

      - name: Type check
        run: python -m mypy src

      - name: Package import
        run: python -c "import sys; sys.path.insert(0, 'src'); import ai_scientist_mvp"

      - name: Unified verification entry
        shell: powershell
        run: powershell -ExecutionPolicy Bypass -File scripts/verify_project.ps1

      - name: Diff hygiene
        run: git diff --check
