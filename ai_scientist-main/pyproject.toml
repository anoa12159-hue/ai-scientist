[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-scientist-mvp"
version = "0.1.0"
description = "AI Scientist MVP: offline faithful replay of the SHRGT45 historical study (T001 engineering skeleton, no business logic yet)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "astropy==7.1.0",
    "jcs==0.2.1",
    "jsonschema==4.26.0",
    "langgraph==1.2.2",
    "numpy==2.2.6",
]

[project.scripts]
ai-scientist-replay = "ai_scientist_mvp.workflow.replay_cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_scientist_mvp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
explicit_package_bases = true
strict = true

[[tool.mypy.overrides]]
module = "jcs"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["langgraph", "langgraph.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["astropy", "astropy.*"]
ignore_missing_imports = true
